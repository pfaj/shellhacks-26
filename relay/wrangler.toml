name = "sockem-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "DIRECTORY", class_name = "Directory" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]
