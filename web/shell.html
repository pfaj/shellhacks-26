<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 60%;
	height: 14px;
	border-radius: 7px;
	overflow: hidden;
	accent-color: #e5424a;
	margin: 0 auto;
}

#sockem-boot-title {
	font-family: system-ui, sans-serif;
	font-size: 44px;
	font-weight: 700;
	letter-spacing: 8px;
	margin-bottom: 16px;
}

#sockem-boot-hint {
	font-family: system-ui, sans-serif;
	font-size: 16px;
	opacity: .55;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
		<script>
window.sockemTilt = { ready: false, started: false, permission: 'unknown', error: '', alpha: 0, beta: 0, gamma: 0 };

function sockemOrientation(e) {
	var t = window.sockemTilt;
	t.alpha = e.alpha || 0;
	t.beta = e.beta || 0;
	t.gamma = e.gamma || 0;
	t.ready = true;
}

function sockemStartTilt() {
	if (window.sockemTilt.started) {
		return;
	}
	window.sockemTilt.started = true;
	if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
		DeviceOrientationEvent.requestPermission().then(function (r) {
			if (r === 'granted') {
				window.addEventListener('deviceorientation', sockemOrientation, true);
				window.sockemTilt.permission = 'granted';
			} else {
				window.sockemTilt.permission = 'denied';
				window.sockemTilt.error = 'motion permission denied';
			}
		}).catch(function (err) {
			window.sockemTilt.permission = 'error';
			window.sockemTilt.error = String(err);
		});
	} else {
		window.addEventListener('deviceorientation', sockemOrientation, true);
		window.sockemTilt.permission = 'granted';
	}
}

(function () {
	function requestOnce() {
		window.removeEventListener('touchend', requestOnce, true);
		window.removeEventListener('click', requestOnce, true);
		sockemStartTilt();
	}
	window.addEventListener('touchend', requestOnce, true);
	window.addEventListener('click', requestOnce, true);
})();

function sockemGetRoom() {
	var params = new URLSearchParams(window.location.search);
	var room = (params.get('room') || '').trim().toUpperCase();
	return /^[A-Z0-9]{4,8}$/.test(room) ? room : '';
}

function sockemQRPng(url, size) {
	if (typeof qrcode === 'undefined') {
		return '';
	}
	var q = qrcode(0, 'M');
	q.addData(url);
	q.make();
	var count = q.getModuleCount();
	var quiet = 4;
	var scale = Math.max(2, Math.floor((size || 512) / (count + quiet * 2)));
	var px = (count + quiet * 2) * scale;
	var canvas = document.createElement('canvas');
	canvas.width = px;
	canvas.height = px;
	var ctx = canvas.getContext('2d');
	ctx.fillStyle = '#ffffff';
	ctx.fillRect(0, 0, px, px);
	ctx.fillStyle = '#000000';
	for (var r = 0; r < count; r++) {
		for (var c = 0; c < count; c++) {
			if (q.isDark(r, c)) {
				ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
			}
		}
	}
	return canvas.toDataURL('image/png');
}

window.sockemTextChanged = null;
var sockemInputHotspot = null;
var sockemTextInput = null;

function sockemTextInputElement() {
	if (!sockemTextInput) {
		var el = document.createElement('input');
		el.type = 'text';
		el.autocomplete = 'off';
		el.autocorrect = 'off';
		el.autocapitalize = 'off';
		el.spellcheck = false;
		el.setAttribute('enterkeyhint', 'done');
		el.style.position = 'fixed';
		el.style.zIndex = '30';
		el.style.boxSizing = 'border-box';
		el.style.textAlign = 'center';
		el.style.fontFamily = 'system-ui, sans-serif';
		el.style.border = '3px solid #ffffff';
		el.style.borderRadius = '14px';
		el.style.background = '#10141d';
		el.style.color = '#ffffff';
		el.style.display = 'none';
		el.style.padding = '0';
		el.addEventListener('input', function () {
			if (window.sockemTextChanged) {
				window.sockemTextChanged(el.value);
			}
		});
		el.addEventListener('keydown', function (event) {
			if (event.key === 'Enter') {
				sockemHideTextInput();
			}
		});
		document.body.appendChild(el);
		sockemTextInput = el;
	}
	return sockemTextInput;
}

function sockemRegisterTextInput(gx, gy, gw, gh, vw, vh, maxLength, value) {
	if (!('ontouchstart' in window)) {
		return;
	}
	var canvas = document.getElementById('canvas');
	var r = canvas.getBoundingClientRect();
	var sx = r.width / vw;
	var sy = r.height / vh;
	sockemInputHotspot = {
		x: r.left + gx * sx,
		y: r.top + gy * sy,
		w: gw * sx,
		h: gh * sy,
		maxLength: maxLength || 32,
		value: value || ''
	};
}

function sockemUnregisterTextInput() {
	sockemInputHotspot = null;
	sockemHideTextInput();
}

function sockemShowTextInput() {
	var el = sockemTextInputElement();
	var h = sockemInputHotspot;
	if (!h) {
		return;
	}
	el.maxLength = h.maxLength;
	el.value = h.value;
	el.style.left = h.x + 'px';
	el.style.top = h.y + 'px';
	el.style.width = h.w + 'px';
	el.style.height = h.h + 'px';
	el.style.fontSize = Math.max(16, h.h * 0.5) + 'px';
	el.style.display = 'block';
	el.focus();
	el.setSelectionRange(el.value.length, el.value.length);
}

function sockemHideTextInput() {
	if (sockemTextInput) {
		sockemTextInput.blur();
		sockemTextInput.style.display = 'none';
	}
}

(function () {
	function inside(x, y) {
		if (!sockemInputHotspot) {
			return false;
		}
		var h = sockemInputHotspot;
		return x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h;
	}
	window.addEventListener('touchend', function (event) {
		var touches = event.changedTouches || [];
		for (var i = 0; i < touches.length; i++) {
			if (inside(touches[i].clientX, touches[i].clientY)) {
				event.preventDefault();
				sockemShowTextInput();
				return;
			}
		}
	}, true);
	window.addEventListener('mouseup', function (event) {
		if (inside(event.clientX, event.clientY)) {
			sockemShowTextInput();
		}
	}, true);
})();

(function () {
	function setHidden(hidden) {
		if (hidden) {
			if (window.sockemPauseAudio) {
				window.sockemPauseAudio();
			}
		} else if (window.sockemResumeAudio) {
			window.sockemResumeAudio();
		}
	}
	document.addEventListener('visibilitychange', function () {
		setHidden(document.hidden);
	}, true);
	window.addEventListener('pagehide', function () {
		setHidden(true);
	}, true);
	window.addEventListener('pageshow', function () {
		setHidden(false);
	}, true);
	window.addEventListener('blur', function () {
		setHidden(true);
	}, false);
	window.addEventListener('focus', function () {
		setHidden(false);
	}, false);
})();
		</script>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="sockem-boot-title">SOCK'EM</div>
			<div id="sockem-boot-hint">First tap will ask for motion access - allow it for tilt controls</div>
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
